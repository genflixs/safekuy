<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">

  <!-- ============================================================
       SEO & SOCIAL META
       Edit juga di config.js (seo section). Static fallback di sini
       agar crawler yang tidak menjalankan JS tetap mendapat meta.
  ============================================================ -->
  <title>MyDrive</title>
  <meta name="description" content="Galeri file modern dengan struktur folder, pencarian, dan dark mode.">
  <meta name="keywords" content="file gallery, file sharing, drive, folder">

  <!-- robots: allow indexing (default). Set noindex jika ingin private -->
  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="MyDrive">
  <meta property="og:description" content="Galeri file modern dengan struktur folder, pencarian, dan dark mode.">
  <meta property="og:image" content="/assets/icons/og-default.svg">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MyDrive">
  <meta name="twitter:description" content="Galeri file modern dengan struktur folder, pencarian, dan dark mode.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">

  <!-- Preconnect untuk image CDN yang umum dipakai (picsum dll) -->
  <link rel="preconnect" href="https://picsum.photos" crossorigin>
  <link rel="dns-prefetch" href="https://picsum.photos">

  <!-- Stylesheet (cache-busting via ?v=16) -->
  <link rel="stylesheet" href="/assets/css/style.css?v=16">

  <!-- Config dimuat lebih dulu agar tersedia sebelum app.js (cache-busting via ?v=16) -->
  <script src="/assets/js/config.js?v=16" defer></script>
  <!-- Video/folder config (edit ini untuk manage folder & video) -->
  <script src="/assets/js/config-videos.js?v=16" defer></script>
</head>
<body>
  <!-- ============================================================
       APP SHELL
       app.js akan merender konten dinamis di dalam <main id="app">
       Struktur di sini hanya header + container, supaya first paint
       cepat.
  ============================================================ -->
  <div class="app-shell">
    <!-- Top bar (glassmorphism) -->
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <a href="/" class="brand" aria-label="Home">
          <span class="brand-mark" id="brandMark">📁</span>
          <span class="brand-text">
            <span class="brand-name" id="brandName">MyDrive</span>
            <span class="brand-tagline" id="brandTagline">File gallery modern</span>
          </span>
        </a>

        <div class="topbar-actions">
          <!-- Search box (di-render/disembunyikan oleh JS sesuai config) -->
          <div class="search-box" id="searchBox" hidden>
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 21l-4.35-4.35M17 11a6 6 0 1 1-12 0 6 6 0 0 1 12 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <input type="search" id="searchInput" placeholder="Cari file..." autocomplete="off" aria-label="Cari">
            <button class="search-clear" id="searchClear" hidden aria-label="Hapus pencarian">×</button>
          </div>

          <!-- Sort dropdown -->
          <div class="sort-box" id="sortBox" hidden>
            <select id="sortSelect" aria-label="Urutkan">
              <option value="default">Default</option>
              <option value="name-asc">Nama (A-Z)</option>
              <option value="name-desc">Nama (Z-A)</option>
              <option value="date-desc">Terbaru</option>
              <option value="date-asc">Terlama</option>
              <option value="views-desc">Terpopuler</option>
              <option value="size-desc">Terbesar</option>
              <option value="count-desc">File terbanyak</option>
            </select>
          </div>

          <!-- Theme toggle -->
          <button class="theme-toggle" id="themeToggle" hidden aria-label="Ganti tema" title="Ganti tema terang/gelap">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="5" fill="currentColor"/>
              <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
              </g>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Breadcrumb container -->
      <nav class="breadcrumb" id="breadcrumb" hidden aria-label="Breadcrumb">
        <ol id="breadcrumbList"></ol>
      </nav>
    </header>

    <!-- Ad slot: header (diisi oleh JS jika config.ads.enabled) -->
    <div class="ad-slot ad-header" id="adHeader" hidden></div>

    <!-- Main content (di-render oleh app.js) -->
    <main class="main" id="app" aria-live="polite">
      <!-- Loading skeleton initial -->
      <div class="loading-state">
        <div class="skeleton-grid">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </div>
    </main>

    <!-- Ad slot: footer -->
    <div class="ad-slot ad-footer" id="adFooter" hidden></div>

    <!-- Footer -->
    <footer class="footer" id="footer">
      <div class="footer-inner">
        <span id="footerText">&copy; 2026 MyDrive. All rights reserved.</span>
        <nav class="footer-links">
          <a href="/tos">Terms</a>
          <a href="/dmca">DMCA</a>
          <a href="/privacy">Privacy</a>
          <a href="/contact">Contact</a>
        </nav>
      </div>
    </footer>
  </div>

  <!-- App logic (dimuat terakhir setelah DOM siap, cache-busting via ?v=16) -->
  <script src="/assets/js/app.js?v=16" defer></script>
</body>
</html>
