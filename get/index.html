    <!-- ==================== CUSTOM STYLES ==================== -->
    <style>
        :root {
            --primary: #ff2d55;
            --primary-dark: #c81e45;
            --primary-glow: rgba(255, 45, 85, 0.6);
            --accent: #00e5ff;
            --bg-dark: #0a0a0f;
            --glass-bg: rgba(15, 15, 25, 0.65);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            --shadow-lg: 0 25px 60px rgba(0, 0, 0, 0.6);
            --radius: 24px;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            background: var(--bg-dark);
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Vegas background overlay */
        .vegas-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(10, 10, 15, 0.85) 0%, rgba(20, 5, 15, 0.75) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* Animated gradient orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 1;
            pointer-events: none;
            animation: float 12s ease-in-out infinite;
        }
        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--primary);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 350px;
            height: 350px;
            background: var(--accent);
            bottom: -100px;
            right: -100px;
            animation-delay: -4s;
        }
        .orb-3 {
            width: 250px;
            height: 250px;
            background: #9b30ff;
            top: 40%;
            right: 20%;
            animation-delay: -8s;
            opacity: 0.25;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, -40px) scale(1.1); }
            66% { transform: translate(-40px, 60px) scale(0.95); }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Glass card */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 50px 45px;
            max-width: 480px;
            width: 100%;
            box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: cardIn 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Animated top border line */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--accent), transparent);
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Warning icon */
        .icon-wrap {
            width: 90px;
            height: 90px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            color: white;
            box-shadow: 0 0 40px var(--primary-glow);
            animation: pulse 2s ease-in-out infinite;
            position: relative;
        }

        .icon-wrap::after {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            opacity: 0.4;
            animation: ripple 2s ease-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        /* Heading */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(22px, 5vw, 30px);
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 28px;
            font-weight: 400;
        }

        /* Countdown circular */
        .timer-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 28px;
        }

        .timer-ring {
            position: relative;
            width: 130px;
            height: 130px;
            margin-bottom: 12px;
        }

        .timer-ring svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .timer-ring circle {
            fill: none;
            stroke-width: 6;
        }

        .ring-bg {
            stroke: rgba(255, 255, 255, 0.08);
        }

        .ring-progress {
            stroke: var(--primary);
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px var(--primary-glow));
            transition: stroke-dashoffset 1s linear;
        }

        .clock {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
        }

        .timer-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Question text */
        .question {
            font-size: 17px;
            font-weight: 500;
            margin-bottom: 28px;
            color: rgba(255, 255, 255, 0.95);
            line-height: 1.5;
        }

        .question strong {
            color: var(--primary);
            font-weight: 700;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            flex: 1;
            min-width: 140px;
            padding: 16px 28px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transition: left 0.6s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-yes {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 8px 24px rgba(255, 45, 85, 0.4);
        }

        .btn-yes:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(255, 45, 85, 0.55);
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .btn-no:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
        }

        .btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        /* Footer info */
        .footer-info {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .footer-info i {
            color: var(--accent);
            margin-right: 6px;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 768px) {
            .card {

                height: 75px;
                font-size: 30px;
                margin-bottom: 18px;

            h1 {

            .timer-ring {

            }

            .clock {

            .question {

            }

            .btn {
                min-width: 120px;
                padding: 14px 20px;
                font-size: 13px;
            }
        }

        @media (max-width: 420px) {
            .btn-group {
                flex-direction: column;
            }

            .btn {
                min-width: 100%;
            }

            .card {
                padding: 30px 20px;
            }
        }

        @media (max-height: 600px) and (orientation: landscape) {
            .card {
                padding: 20px 30px;
            }
            .icon-wrap {
                width: 60px;
                height: 60px;
                font-size: 24px;
                margin-bottom: 12px;
            }
            .timer-ring {

            }
            .clock { font-size: 20px; }
            .question { margin-bottom: 16px; font-size: 14px; }
            .footer-info { margin-top: 16px; padding-top: 12px; }
        }

        /* Reduce motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

    <!-- ==================== COUNTDOWN TIMER ==================== -->
    <script>
        (function() {
            var clockEl = document.getElementById('clock');
            var ringEl = document.getElementById('ringProgress');
            var circumference = 339.292;
            var totalSeconds = 67; // 01:07 = 67 seconds

            function updateRing(secondsLeft) {
                var progress = (totalSeconds - secondsLeft) / totalSeconds;
                var offset = circumference * progress;
                ringEl.style.strokeDashoffset = offset;
            }

            var interval = setInterval(function() {
                var timer = clockEl.textContent;
                var timeArray = timer.split(':');
                var minutes = parseInt(timeArray[0], 10);
                var seconds = parseInt(timeArray[1], 10);
                seconds -= 1;

                if (seconds < 0 && minutes > 0) {
                    minutes -= 1;
                    seconds = 59;
                }

                if (minutes === 0 && seconds === 0) {
                    clearInterval(interval);
                    clockEl.textContent = "00:00";
                    updateRing(0);
                    return;
                }

                var display = (minutes < 10 ? "0" + minutes : minutes) + ":" + (seconds < 10 ? "0" + seconds : seconds);
                clockEl.textContent = display;

                var secondsLeft = minutes * 60 + seconds;
                updateRing(secondsLeft);
            }, 1000);
        })();
    </script>
